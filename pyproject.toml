[project]
name = "credentialiq-ai"
version = "1.0.0-poc"
description = "CredentialIQ AI Agentic Provider Credentialing Python Engine"
authors = [{name = "CredentialIQ AI Team"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
